<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 260" role="img" aria-labelledby="dynamo-prefix-members-title">
  <title id="dynamo-prefix-members-title">从索引树查 A、B、D</title>
  <desc>压缩树以块键表示共享前缀，节点上的 P1、P2 是拥有该前缀的 worker。</desc>
  <text x="16" y="29" class="diagram-title" text-anchor="start">从索引树查 A、B、D</text>
  <path d="M233 66 L233 92" class="edge"/>
  <path d="M223 115 L142 138" class="edge"/>
  <path d="M245 114 L325 138" class="edge"/>
  <path d="M131 160 L131 184" class="edge"/>
  <g data-frame="0">
    <title>从根开始</title>
    <desc>查询块序列 A、B、D。P1 缓存 A、B、C，P2 缓存 A、X。</desc>
    <rect x="182" y="44" width="102" height="28" rx="5" class="fresh"/><text x="233.0" y="63.0" class="label" text-anchor="middle">根</text>
    <rect x="182" y="88" width="102" height="28" rx="5" class="idle"/><text x="233.0" y="107.0" class="label" text-anchor="middle">A · P1/P2</text>
    <rect x="80" y="133" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="152.0" class="label" text-anchor="middle">B · P1</text>
    <rect x="287" y="133" width="102" height="28" rx="5" class="idle"/><text x="338.0" y="152.0" class="label" text-anchor="middle">X · P2</text>
    <rect x="80" y="179" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="198.0" class="label" text-anchor="middle">C · P1</text>
    <text x="236" y="241" class="number" text-anchor="middle">P1 = 0 块     P2 = 0 块</text>
  </g>
  <g data-frame="1" display="none">
    <title>两者都命中 A</title>
    <desc>A 节点同时有 P1 和 P2，两个 worker 都命中第一块。</desc>
    <rect x="182" y="44" width="102" height="28" rx="5" class="stored"/><text x="233.0" y="63.0" class="label" text-anchor="middle">根</text>
    <rect x="182" y="88" width="102" height="28" rx="5" class="fresh"/><text x="233.0" y="107.0" class="label" text-anchor="middle">A · P1/P2</text>
    <rect x="80" y="133" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="152.0" class="label" text-anchor="middle">B · P1</text>
    <rect x="287" y="133" width="102" height="28" rx="5" class="idle"/><text x="338.0" y="152.0" class="label" text-anchor="middle">X · P2</text>
    <rect x="80" y="179" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="198.0" class="label" text-anchor="middle">C · P1</text>
    <text x="236" y="241" class="number" text-anchor="middle">P1 = 1 块     P2 = 1 块</text>
  </g>
  <g data-frame="2" display="none">
    <title>B 只在 P1</title>
    <desc>从 A 向 B 继续，P2 的另一条边是 X，它的连续命中止于一块。</desc>
    <rect x="182" y="44" width="102" height="28" rx="5" class="stored"/><text x="233.0" y="63.0" class="label" text-anchor="middle">根</text>
    <rect x="182" y="88" width="102" height="28" rx="5" class="stored"/><text x="233.0" y="107.0" class="label" text-anchor="middle">A · P1/P2</text>
    <rect x="80" y="133" width="102" height="28" rx="5" class="fresh"/><text x="131.0" y="152.0" class="label" text-anchor="middle">B · P1</text>
    <rect x="287" y="133" width="102" height="28" rx="5" class="idle"/><text x="338.0" y="152.0" class="label" text-anchor="middle">X · P2</text>
    <rect x="80" y="179" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="198.0" class="label" text-anchor="middle">C · P1</text>
    <text x="236" y="241" class="number" text-anchor="middle">P1 = 2 块     P2 = 1 块</text>
  </g>
  <g data-frame="3" display="none">
    <title>没有通向 D 的边</title>
    <desc>P1 在 B 后只有 C，因此查询在 B 停住。最终比较的是两块与一块。</desc>
    <rect x="182" y="44" width="102" height="28" rx="5" class="stored"/><text x="233.0" y="63.0" class="label" text-anchor="middle">根</text>
    <rect x="182" y="88" width="102" height="28" rx="5" class="stored"/><text x="233.0" y="107.0" class="label" text-anchor="middle">A · P1/P2</text>
    <rect x="80" y="133" width="102" height="28" rx="5" class="fresh"/><text x="131.0" y="152.0" class="label" text-anchor="middle">B · P1</text>
    <rect x="287" y="133" width="102" height="28" rx="5" class="idle"/><text x="338.0" y="152.0" class="label" text-anchor="middle">X · P2</text>
    <rect x="80" y="179" width="102" height="28" rx="5" class="idle"/><text x="131.0" y="198.0" class="label" text-anchor="middle">C · P1</text>
    <path d="M163 159 L244 188" class="edge" stroke-dasharray="4 5"/>
    <text x="281" y="197" class="number" text-anchor="middle">D · 无节点</text>
    <text x="236" y="241" class="number" text-anchor="middle">P1 = 2 块     P2 = 1 块</text>
  </g>
</svg>
