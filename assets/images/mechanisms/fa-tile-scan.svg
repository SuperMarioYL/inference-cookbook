<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 265" role="img" aria-labelledby="fa-tile-scan-title">
  <title id="fa-tile-scan-title">固定一个 Q 块，遍历 KV 块</title>
  <desc>分数矩阵有 4 行、6 列，每个 tile 覆盖 2 行、2 列。</desc>
