<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 250" role="img" aria-labelledby="fa-tiles-title">
  <title id="fa-tiles-title">一行注意力分数，分两块读入</title>
  <desc>示例只用标量 V。输出是权重归一化后的加权和。</desc>
  <defs><marker id="fa-tiles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" class="arrowhead"/></marker></defs>
  <text x="15" y="28" class="diagram-title" text-anchor="start">一行注意力分数，分两块读入</text>

  <g data-frame="0">
    <title>读入前</title>
    <desc>初始归一化和与加权和均为 0。每次只处理一块分数及对应的 V。</desc>
    <text x="16" y="70" class="label" text-anchor="start">分数 s</text>
    <rect x="112" y="47" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="69.5" class="label" text-anchor="middle">0, ln 2</text>
    <rect x="267" y="47" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="69.5" class="label" text-anchor="middle">ln 4, 0</text>
    <text x="16" y="114" class="label" text-anchor="start">值 V</text>
    <rect x="112" y="90" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="112.5" class="label" text-anchor="middle">1, 3</text>
    <rect x="267" y="90" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="112.5" class="label" text-anchor="middle">2, 4</text>
    <text x="42" y="166" class="label" text-anchor="start">最大值 m</text>
    <text x="179" y="166" class="label" text-anchor="start">归一化和 ℓ</text>
    <text x="322" y="166" class="label" text-anchor="start">加权和 u</text>
    <text x="76" y="204" class="number" text-anchor="middle">—</text>
    <text x="217" y="204" class="number" text-anchor="middle">0</text>
    <text x="356" y="204" class="number" text-anchor="middle">0</text>
  </g>
  <g data-frame="1" display="none">
    <title>处理第一块</title>
    <desc>最大值是 ln 2。相对权重为 1/2 和 1，所以 ℓ = 1.5，u = 0.5 × 1 + 1 × 3 = 3.5。</desc>
    <text x="16" y="70" class="label" text-anchor="start">分数 s</text>
    <rect x="112" y="47" width="142" height="35" rx="5" class="stored"/>
    <text x="183.0" y="69.5" class="label" text-anchor="middle">0, ln 2</text>
    <rect x="267" y="47" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="69.5" class="label" text-anchor="middle">ln 4, 0</text>
    <text x="16" y="114" class="label" text-anchor="start">值 V</text>
    <rect x="112" y="90" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="112.5" class="label" text-anchor="middle">1, 3</text>
    <rect x="267" y="90" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="112.5" class="label" text-anchor="middle">2, 4</text>
    <text x="42" y="166" class="label" text-anchor="start">最大值 m</text>
    <text x="179" y="166" class="label" text-anchor="start">归一化和 ℓ</text>
    <text x="322" y="166" class="label" text-anchor="start">加权和 u</text>
    <text x="76" y="204" class="number" text-anchor="middle">ln 2</text>
    <text x="217" y="204" class="number" text-anchor="middle">1.5</text>
    <text x="356" y="204" class="number" text-anchor="middle">3.5</text>
  </g>
  <g data-frame="2" display="none">
    <title>按新最大值缩放旧结果</title>
    <desc>第二块将最大值提高到 ln 4。先把已有的 ℓ 与 u 乘以 exp(ln 2 − ln 4) = 1/2。</desc>
    <text x="16" y="70" class="label" text-anchor="start">分数 s</text>
    <rect x="112" y="47" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="69.5" class="label" text-anchor="middle">0, ln 2</text>
    <rect x="267" y="47" width="164" height="35" rx="5" class="fresh"/>
    <text x="349.0" y="69.5" class="label" text-anchor="middle">ln 4, 0</text>
    <text x="16" y="114" class="label" text-anchor="start">值 V</text>
    <rect x="112" y="90" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="112.5" class="label" text-anchor="middle">1, 3</text>
    <rect x="267" y="90" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="112.5" class="label" text-anchor="middle">2, 4</text>
    <text x="42" y="166" class="label" text-anchor="start">最大值 m</text>
    <text x="179" y="166" class="label" text-anchor="start">归一化和 ℓ</text>
    <text x="322" y="166" class="label" text-anchor="start">加权和 u</text>
    <text x="76" y="204" class="number" text-anchor="middle">ln 4</text>
    <text x="217" y="204" class="number" text-anchor="middle">0.75</text>
    <text x="356" y="204" class="number" text-anchor="middle">1.75</text>
  </g>
  <g data-frame="3" display="none">
    <title>加入第二块并归一化</title>
    <desc>第二块的相对权重为 1 和 1/4。最终 ℓ = 2，u = 4.75，输出 u / ℓ = 2.375。</desc>
    <text x="16" y="70" class="label" text-anchor="start">分数 s</text>
    <rect x="112" y="47" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="69.5" class="label" text-anchor="middle">0, ln 2</text>
    <rect x="267" y="47" width="164" height="35" rx="5" class="fresh"/>
    <text x="349.0" y="69.5" class="label" text-anchor="middle">ln 4, 0</text>
    <text x="16" y="114" class="label" text-anchor="start">值 V</text>
    <rect x="112" y="90" width="142" height="35" rx="5" class="idle"/>
    <text x="183.0" y="112.5" class="label" text-anchor="middle">1, 3</text>
    <rect x="267" y="90" width="164" height="35" rx="5" class="idle"/>
    <text x="349.0" y="112.5" class="label" text-anchor="middle">2, 4</text>
    <text x="42" y="166" class="label" text-anchor="start">最大值 m</text>
    <text x="179" y="166" class="label" text-anchor="start">归一化和 ℓ</text>
    <text x="322" y="166" class="label" text-anchor="start">加权和 u</text>
    <text x="76" y="204" class="number" text-anchor="middle">ln 4</text>
    <text x="217" y="204" class="number" text-anchor="middle">2</text>
    <text x="356" y="204" class="number" text-anchor="middle">4.75</text>
  </g>
</svg>
