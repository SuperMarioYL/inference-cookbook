<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 254" role="img" aria-labelledby="mooncake-numa-rails-title">
  <title id="mooncake-numa-rails-title">同一个目标，可以沿两条 rail 到达</title>
  <desc>两台双网卡主机之间有两条可达路径。GPU 和 NIC 的 NUMA 距离会影响选路。</desc>
  <text x="15" y="27" text-anchor="start" class="diagram-title">同一个目标，可以沿两条 rail 到达</text>
  <g data-frame="0">
    <title>列出候选路径</title>
    <desc>两侧 NIC 与设备的距离、可达性和配置决定候选路径。这里画出两个可选 rail。</desc>
    <text x="24" y="59" text-anchor="start" class="subhead">源主机 · GPU A</text>
    <text x="307" y="59" text-anchor="start" class="subhead">目标主机 · GPU B</text>
    <rect x="15" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="305" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="37" y="83" width="98" height="30" rx="5" class="stored"/>
    <text x="86.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="37" y="154" width="98" height="30" rx="5" class="idle"/>
    <text x="86.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <rect x="327" y="83" width="98" height="30" rx="5" class="stored"/>
    <text x="376.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="327" y="154" width="98" height="30" rx="5" class="idle"/>
    <text x="376.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <path d="M 135 98 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="1.7" opacity="1" stroke-dasharray="none"/>
    <path d="M 135 169 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="1.7" opacity="0.5" stroke-dasharray="3 3"/>
    <text x="231" y="90" text-anchor="middle" class="note">rail 0</text>
    <text x="231" y="159" text-anchor="middle" class="note">rail 1</text>
    <text x="16" y="230" text-anchor="start" class="note">两条链路都可达，虚线表示本步未使用。</text>
  </g>
  <g data-frame="1" display="none">
    <title>第一片沿 rail 0 传输</title>
    <desc>按拓扑优先级先选本地 NIC，数据从源端经 rail 0 到达对端。</desc>
    <text x="24" y="59" text-anchor="start" class="subhead">源主机 · GPU A</text>
    <text x="307" y="59" text-anchor="start" class="subhead">目标主机 · GPU B</text>
    <rect x="15" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="305" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="37" y="83" width="98" height="30" rx="5" class="stored"/>
    <text x="86.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="37" y="154" width="98" height="30" rx="5" class="idle"/>
    <text x="86.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <rect x="327" y="83" width="98" height="30" rx="5" class="stored"/>
    <text x="376.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="327" y="154" width="98" height="30" rx="5" class="idle"/>
    <text x="376.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <path d="M 135 98 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="3" opacity="1" stroke-dasharray="none"/>
    <path d="M 135 169 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="1.7" opacity="0.5" stroke-dasharray="3 3"/>
    <text x="231" y="90" text-anchor="middle" class="note">rail 0</text>
    <text x="231" y="159" text-anchor="middle" class="note">rail 1</text>
    <circle cx="313" cy="98" r="5" class="packet" data-dx="-155" data-dy="0"/>
    <text x="16" y="230" text-anchor="start" class="note">示例第一片走本地 NUMA 域的网卡。</text>
  </g>
  <g data-frame="2" display="none">
    <title>下一片可以改走 rail 1</title>
    <desc>具体选路取决于所用 TE/TENT 策略、链路状态与配置。两条链路上的进度可以独立观察。</desc>
    <text x="24" y="59" text-anchor="start" class="subhead">源主机 · GPU A</text>
    <text x="307" y="59" text-anchor="start" class="subhead">目标主机 · GPU B</text>
    <rect x="15" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="305" y="72" width="143" height="126" rx="12" class="idle"/>
    <rect x="37" y="83" width="98" height="30" rx="5" class="idle"/>
    <text x="86.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="37" y="154" width="98" height="30" rx="5" class="fresh"/>
    <text x="86.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <rect x="327" y="83" width="98" height="30" rx="5" class="idle"/>
    <text x="376.0" y="103.0" text-anchor="middle" class="label">本地 NIC</text>
    <rect x="327" y="154" width="98" height="30" rx="5" class="fresh"/>
    <text x="376.0" y="174.0" text-anchor="middle" class="label">远端 NIC</text>
    <path d="M 135 98 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="1.7" opacity="0.55" stroke-dasharray="3 3"/>
    <path d="M 135 169 H 326" fill="none" stroke="var(--figure-edge,#547078)" stroke-width="3" opacity="1" stroke-dasharray="none"/>
    <text x="231" y="90" text-anchor="middle" class="note">rail 0</text>
    <text x="231" y="159" text-anchor="middle" class="note">rail 1</text>
    <circle cx="313" cy="169" r="5" class="packet" data-dx="-155" data-dy="0"/>
    <text x="16" y="230" text-anchor="start" class="note">当策略及可达性允许时，后续片可改走另一条 rail。</text>
  </g>
</svg>
