<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 265" role="img" aria-labelledby="torch-strides-title">
  <title id="torch-strides-title">从二维下标走到存储位置</title>
  <desc>六个数连续存放；转置只改变解释这些数的元数据。</desc>
<defs><marker id="torch-strides-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="arrowhead"/></marker></defs>
<text x="14" y="28" class="diagram-title" text-anchor="start">从二维下标走到存储位置</text>

  <g data-frame="0">
    <title>起点</title>
    <desc>形状为 [2,3] 的连续张量，访问第一行第一列，元素偏移为 0。</desc>
    <text x="16" y="65" class="number" text-anchor="start">t[0,0]</text>
    <text x="16" y="92" class="label" text-anchor="start">stride [3,1]</text>
    <rect x="168" y="53" width="48" height="27" rx="4" class="fresh"/><text x="192" y="71.5" class="label" text-anchor="middle">1</text>
    <rect x="224" y="53" width="48" height="27" rx="4" class="idle"/><text x="248" y="71.5" class="label" text-anchor="middle">2</text>
    <rect x="280" y="53" width="48" height="27" rx="4" class="idle"/><text x="304" y="71.5" class="label" text-anchor="middle">3</text>
    <rect x="168" y="86" width="48" height="27" rx="4" class="idle"/><text x="192" y="104.5" class="label" text-anchor="middle">4</text>
    <rect x="224" y="86" width="48" height="27" rx="4" class="idle"/><text x="248" y="104.5" class="label" text-anchor="middle">5</text>
    <rect x="280" y="86" width="48" height="27" rx="4" class="idle"/><text x="304" y="104.5" class="label" text-anchor="middle">6</text>
    <text x="16" y="179" class="label" text-anchor="start">底层存储</text>
    <rect x="113" y="160" width="49" height="34" rx="4" class="stored"/><text x="137.5" y="182" class="label" text-anchor="middle">1</text>
    <text x="137" y="213" class="note" text-anchor="middle">0</text>
    <rect x="168" y="160" width="49" height="34" rx="4" class="idle"/><text x="192.5" y="182" class="label" text-anchor="middle">2</text>
    <text x="192" y="213" class="note" text-anchor="middle">1</text>
    <rect x="223" y="160" width="49" height="34" rx="4" class="idle"/><text x="247.5" y="182" class="label" text-anchor="middle">3</text>
    <text x="247" y="213" class="note" text-anchor="middle">2</text>
    <rect x="278" y="160" width="49" height="34" rx="4" class="idle"/><text x="302.5" y="182" class="label" text-anchor="middle">4</text>
    <text x="302" y="213" class="note" text-anchor="middle">3</text>
    <rect x="333" y="160" width="49" height="34" rx="4" class="idle"/><text x="357.5" y="182" class="label" text-anchor="middle">5</text>
    <text x="357" y="213" class="note" text-anchor="middle">4</text>
    <rect x="388" y="160" width="49" height="34" rx="4" class="idle"/><text x="412.5" y="182" class="label" text-anchor="middle">6</text>
    <text x="412" y="213" class="note" text-anchor="middle">5</text>
    <text x="16" y="215" class="label" text-anchor="start">元素偏移</text>
    <text x="16" y="247" class="number" text-anchor="start">0 × 3 + 0 × 1 = 0</text>
  </g>
  <g data-frame="1" display="none">
    <title>沿两条轴移动</title>
    <desc>移动一行跨过 3 个元素，再移动一列跨 1 个元素，t[1,1] 得到 5。</desc>
    <text x="16" y="65" class="number" text-anchor="start">t[1,1]</text>
    <text x="16" y="92" class="label" text-anchor="start">stride [3,1]</text>
    <rect x="168" y="53" width="48" height="27" rx="4" class="idle"/><text x="192" y="71.5" class="label" text-anchor="middle">1</text>
    <rect x="224" y="53" width="48" height="27" rx="4" class="idle"/><text x="248" y="71.5" class="label" text-anchor="middle">2</text>
    <rect x="280" y="53" width="48" height="27" rx="4" class="idle"/><text x="304" y="71.5" class="label" text-anchor="middle">3</text>
    <rect x="168" y="86" width="48" height="27" rx="4" class="idle"/><text x="192" y="104.5" class="label" text-anchor="middle">4</text>
    <rect x="224" y="86" width="48" height="27" rx="4" class="fresh"/><text x="248" y="104.5" class="label" text-anchor="middle">5</text>
    <rect x="280" y="86" width="48" height="27" rx="4" class="idle"/><text x="304" y="104.5" class="label" text-anchor="middle">6</text>
    <text x="16" y="179" class="label" text-anchor="start">底层存储</text>
    <rect x="113" y="160" width="49" height="34" rx="4" class="idle"/><text x="137.5" y="182" class="label" text-anchor="middle">1</text>
    <text x="137" y="213" class="note" text-anchor="middle">0</text>
    <rect x="168" y="160" width="49" height="34" rx="4" class="idle"/><text x="192.5" y="182" class="label" text-anchor="middle">2</text>
    <text x="192" y="213" class="note" text-anchor="middle">1</text>
    <rect x="223" y="160" width="49" height="34" rx="4" class="idle"/><text x="247.5" y="182" class="label" text-anchor="middle">3</text>
    <text x="247" y="213" class="note" text-anchor="middle">2</text>
    <rect x="278" y="160" width="49" height="34" rx="4" class="idle"/><text x="302.5" y="182" class="label" text-anchor="middle">4</text>
    <text x="302" y="213" class="note" text-anchor="middle">3</text>
    <rect x="333" y="160" width="49" height="34" rx="4" class="stored"/><text x="357.5" y="182" class="label" text-anchor="middle">5</text>
    <text x="357" y="213" class="note" text-anchor="middle">4</text>
    <rect x="388" y="160" width="49" height="34" rx="4" class="idle"/><text x="412.5" y="182" class="label" text-anchor="middle">6</text>
    <text x="412" y="213" class="note" text-anchor="middle">5</text>
    <text x="16" y="215" class="label" text-anchor="start">元素偏移</text>
    <text x="16" y="247" class="number" text-anchor="start">1 × 3 + 1 × 1 = 4</text>
  </g>
  <g data-frame="2" display="none">
    <title>交换两条轴</title>
    <desc>转置后形状为 [3,2]、stride 为 [1,3]。底层六个元素顺序不变。</desc>
    <text x="16" y="65" class="number" text-anchor="start">t.T[1,1]</text>
    <text x="16" y="92" class="label" text-anchor="start">stride [1,3]</text>
    <rect x="168" y="53" width="48" height="27" rx="4" class="idle"/><text x="192" y="71.5" class="label" text-anchor="middle">1</text>
    <rect x="224" y="53" width="48" height="27" rx="4" class="idle"/><text x="248" y="71.5" class="label" text-anchor="middle">4</text>
    <rect x="168" y="86" width="48" height="27" rx="4" class="idle"/><text x="192" y="104.5" class="label" text-anchor="middle">2</text>
    <rect x="224" y="86" width="48" height="27" rx="4" class="fresh"/><text x="248" y="104.5" class="label" text-anchor="middle">5</text>
    <rect x="168" y="119" width="48" height="27" rx="4" class="idle"/><text x="192" y="137.5" class="label" text-anchor="middle">3</text>
    <rect x="224" y="119" width="48" height="27" rx="4" class="idle"/><text x="248" y="137.5" class="label" text-anchor="middle">6</text>
    <text x="16" y="179" class="label" text-anchor="start">底层存储</text>
    <rect x="113" y="160" width="49" height="34" rx="4" class="idle"/><text x="137.5" y="182" class="label" text-anchor="middle">1</text>
    <text x="137" y="213" class="note" text-anchor="middle">0</text>
    <rect x="168" y="160" width="49" height="34" rx="4" class="idle"/><text x="192.5" y="182" class="label" text-anchor="middle">2</text>
    <text x="192" y="213" class="note" text-anchor="middle">1</text>
    <rect x="223" y="160" width="49" height="34" rx="4" class="idle"/><text x="247.5" y="182" class="label" text-anchor="middle">3</text>
    <text x="247" y="213" class="note" text-anchor="middle">2</text>
    <rect x="278" y="160" width="49" height="34" rx="4" class="idle"/><text x="302.5" y="182" class="label" text-anchor="middle">4</text>
    <text x="302" y="213" class="note" text-anchor="middle">3</text>
    <rect x="333" y="160" width="49" height="34" rx="4" class="stored"/><text x="357.5" y="182" class="label" text-anchor="middle">5</text>
    <text x="357" y="213" class="note" text-anchor="middle">4</text>
    <rect x="388" y="160" width="49" height="34" rx="4" class="idle"/><text x="412.5" y="182" class="label" text-anchor="middle">6</text>
    <text x="412" y="213" class="note" text-anchor="middle">5</text>
    <text x="16" y="215" class="label" text-anchor="start">元素偏移</text>
    <text x="16" y="247" class="number" text-anchor="start">1 × 1 + 1 × 3 = 4</text>
  </g>
</svg>
