    <rect x="312" y="175" width="50" height="29" rx="5" class="idle"/><text x="337.0" y="194.5" class="label" text-anchor="middle">×</text>
    <rect x="138" y="212" width="50" height="29" rx="5" class="idle"/><text x="163.0" y="231.5" class="label" text-anchor="middle">·</text>
    <rect x="196" y="212" width="50" height="29" rx="5" class="idle"/><text x="221.0" y="231.5" class="label" text-anchor="middle">·</text>
    <rect x="254" y="212" width="50" height="29" rx="5" class="idle"/><text x="279.0" y="231.5" class="label" text-anchor="middle">·</text>
    <rect x="312" y="212" width="50" height="29" rx="5" class="idle"/><text x="337.0" y="231.5" class="label" text-anchor="middle">·</text>
  </g>
  <g data-frame="3" display="none">
    <title>计算 Q3</title>
    <desc>Q3 可以读取 K0 到 K3。逐行叠起来就是完整的下三角可见区域。</desc>
    <rect x="138" y="101" width="50" height="29" rx="5" class="stored"/><text x="163.0" y="120.5" class="label" text-anchor="middle">读</text>
    <rect x="196" y="101" width="50" height="29" rx="5" class="idle"/><text x="221.0" y="120.5" class="label" text-anchor="middle">×</text>
    <rect x="254" y="101" width="50" height="29" rx="5" class="idle"/><text x="279.0" y="120.5" class="label" text-anchor="middle">×</text>
