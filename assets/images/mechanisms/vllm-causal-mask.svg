    <rect x="196" y="138" width="50" height="29" rx="5" class="stored"/><text x="221.0" y="157.5" class="label" text-anchor="middle">读</text>
    <rect x="254" y="138" width="50" height="29" rx="5" class="idle"/><text x="279.0" y="157.5" class="label" text-anchor="middle">×</text>
    <rect x="312" y="138" width="50" height="29" rx="5" class="idle"/><text x="337.0" y="157.5" class="label" text-anchor="middle">×</text>
    <rect x="138" y="175" width="50" height="29" rx="5" class="fresh"/><text x="163.0" y="194.5" class="label" text-anchor="middle">读</text>
    <rect x="196" y="175" width="50" height="29" rx="5" class="fresh"/><text x="221.0" y="194.5" class="label" text-anchor="middle">读</text>
