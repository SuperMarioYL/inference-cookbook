  </g>
  <g data-frame="2" display="none">
    <title>计算 Q2</title>
    <desc>位置 2 可读取位置 0 到 2 的键值。后面的位置由因果掩码屏蔽。</desc>
    <rect x="138" y="101" width="50" height="29" rx="5" class="stored"/><text x="163.0" y="120.5" class="label" text-anchor="middle">读</text>
    <rect x="196" y="101" width="50" height="29" rx="5" class="idle"/><text x="221.0" y="120.5" class="label" text-anchor="middle">×</text>
    <rect x="254" y="101" width="50" height="29" rx="5" class="idle"/><text x="279.0" y="120.5" class="label" text-anchor="middle">×</text>
