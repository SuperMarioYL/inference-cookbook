{{ if .Page.Store.Get "hasMechanism" }}
  {{ $script := resources.Get "js/mechanism.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" defer></script>
{{ end }}
{{ if .Page.Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs';

  const diagrams = [...document.querySelectorAll('.mermaid')];
  const sources = diagrams.map(diagram => diagram.textContent);
  let renderedTheme;
  async function render() {
    const theme = document.documentElement.dataset.bsTheme === 'dark' ? 'dark' : 'neutral';
    if (theme === renderedTheme) return;
    renderedTheme = theme;
    mermaid.initialize({startOnLoad: false, theme});
    for (const [i, diagram] of diagrams.entries()) {
      diagram.textContent = sources[i];
      diagram.removeAttribute('data-processed');
    }
    await mermaid.run({nodes: diagrams});
  }
  let rendering = render();
  new MutationObserver(() => {
    rendering = rendering.catch(console.error).then(render);
  }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-bs-theme']});
</script>
{{ end }}
